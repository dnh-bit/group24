name: course_plan
description: "برنامه درسی · دانشگاه فرهنگیان"
publish_to: 'none'
version: 0.0.10+10

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  shared_preferences: ^2.3.2
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf

flutter_launcher_icons:
  android: true
  # پروژه فقط اندرویدیه؛ اگه ios: true باشه، flutter_launcher_icons دنبال
  # پوشهٔ ios/Runner می‌گرده و بیلد با PathNotFoundException می‌افته.
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F7F8EF"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
